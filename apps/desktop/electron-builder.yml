appId: tools.saturnai.desktop
productName: Saturn AI
electronVersion: 43.4.0
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
# Profile plugins resolve as ordinary packages and the Harness-home fallback
# links to them. Keep those paths real on disk on both macOS and Windows.
asar: false
# The deployed runtime uses platform prebuilds/N-API. Re-running pnpm here
# would treat the staging directory as the source workspace and replace it.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - lib/**/*
  - package.json
  # Runtime tray icons resolved from the bundled lib directory's ../assets.
  - assets/**/*
  # Pinned electron-updater GitHub channel (eleazarcheckings-byte/dshcode).
  - app-update.yml
extraResources:
  - from: licenses
    to: licenses
  # The deployment-owned skins tree the skin center reads at runtime. The
  # node-module collector would drop an orphan directory inside node_modules,
  # so the staged skins-extras assembly ships through extraResources into the
  # exact ancestor the patched skin center resolves.
  - from: skins-extras
    to: app/node_modules/skins
  # The dsh-web-ui compat shim (npm-unpublished) ships beside the family
  # packages so bare plugin rows resolve it from the app's own node_modules.
  - from: compat-extras
    to: app/node_modules/@linxin666
mac:
  category: public.app-category.developer-tools
  # Signing identity is auto-discovered from the keychain (Apple Development /
  # Developer ID Application / Apple Distribution). A valid signature is
  # REQUIRED for macOS notifications: UNUserNotificationCenter silently drops
  # every notification from an ad-hoc (linker-signed) app and never shows the
  # permission prompt. Builds without any signing certificate skip signing
  # with a warning (notifications unavailable, build still succeeds);
  # set CSC_NAME to force a specific identity, or CSC_LINK/CSC_KEY_PASSWORD
  # for CI signing from a .p12.
  icon: build/icon.svg
  hardenedRuntime: true
  target:
    - dmg
    - zip
win:
  # An explicit multi-resolution ICO rather than the SVG master: electron-builder
  # rasterizes an SVG once and downsamples, and the ring mark's hairline stroke
  # does not survive at 16/20 px, where it collapses into a diagonal bar. The
  # committed ICO carries one optically compensated raster per size.
  # Regenerate with the repo-level scripts/icons/build-icons.mjs.
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Saturn AI
  runAfterFinish: true
  # Committed artwork staged into build/ by scripts/prepare-package.mjs
  # (assets/installer*.ico, assets/uninstallerIcon.ico). Set explicitly rather
  # than leaning on electron-builder's implicit build/ lookup, so a rename
  # shows up as a hard error instead of a silent fall back to a default icon.
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  installerHeaderIcon: build/installerHeaderIcon.ico
publish:
  provider: github
  owner: eleazarcheckings-byte
  repo: dshcode
  releaseType: release
  # Packaging still uses `--publish never`; this block only names the
  # electron-updater GitHub feed. Never retarget to whitelonng/dshcode.
