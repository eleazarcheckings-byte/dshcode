# Unsigned macOS + Windows desktop release lane. Triggered by a
# `desktop-release-v*` tag push; builds electron-builder artifacts and
# attaches them to a GitHub release. The repo is public, so these
# runner-minutes are free
# (verified: `gh repo view eleazarcheckings-byte/dshcode` -> visibility PUBLIC).
#
# Deliberately namespaced apart from the pre-existing `.github/workflows/desktop.yml`,
# which already triggers on `desktop-v*` and runs its own `gh release create`.
# Sharing that tag would fire both workflows on one push and race each other
# creating the same GitHub release (Mars fix-round finding, 2026-09-15) --
# this lane uses its own tag prefix instead so the two never collide. See
# apps/desktop/RELEASE.md for the reconciliation note.
#
# Unsigned by design: no CSC_LINK/CSC_KEY_PASSWORD/CSC_NAME secret is set, so
# electron-builder skips macOS code signing. CSC_IDENTITY_AUTO_DISCOVERY=false
# stops electron-builder from grabbing a keychain identity that happens to be
# present on the runner and silently producing a differently-signed build
# from run to run. See apps/desktop/RELEASE.md for the signed/notarized path.
name: Desktop Release

on:
  push:
    tags:
      - 'desktop-release-v*'

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            command: dist:mac:arm64
            artifact: macos-arm64
          - name: macOS x64
            runner: macos-15-intel
            command: dist:mac:x64
            artifact: macos-x64
          - name: Windows x64
            runner: windows-latest
            command: dist:win:x64
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Repo pins pnpm via "packageManager": "pnpm@11.7.0" (root package.json);
      # pnpm/action-setup reads that field, so no version is repeated here.
      # Matches the proven setup already used in desktop.yml (pnpm/action-setup
      # before setup-node, rather than a bare `corepack enable`).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package (unsigned)
        run: pnpm --filter @dshcode/desktop run ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: dshcode-${{ matrix.artifact }}
          path: |
            .artifacts/desktop/release/*.dmg
            .artifacts/desktop/release/*.zip
            .artifacts/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dshcode-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Saturn AI desktop build for macOS (arm64 + x64) and Windows (x64).

            These packages are unsigned: no Apple Developer ID or notarization,
            no Windows code-signing certificate. macOS Gatekeeper and Windows
            SmartScreen will warn before first launch. See RELEASE.md in
            apps/desktop for what signing costs and when to turn it on.
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          release_args=()
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Saturn AI Desktop $version" \
            --notes "$RELEASE_NOTES" \
            --verify-tag \
            "${release_args[@]}"
      # Note: this tag namespace (desktop-release-v*) is exclusive to this
      # workflow, so no other job can already hold the release for this tag --
      # unlike sharing desktop.yml's desktop-v* prefix would.
