name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            command: dist:mac:arm64
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            command: dist:mac:x64
            artifact: macos-x64
          - name: Windows x64
            runner: windows-2025
            command: dist:win:x64
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test Windows directory picker
        if: runner.os == 'Windows'
        run: pnpm exec vitest run packages/host/directory-picker-native/tests/win32-dialog-host.spec.ts packages/host/directory-picker-native/tests/win32-dialog-bindings.spec.ts

      - name: Test directory decoding in Electron
        run: node apps/desktop/scripts/test-electron-picker.mjs

      # Opt-in Apple signing + notarization. electron-builder 26.15.3 (pinned
      # in apps/desktop/package.json) reads CSC_LINK/CSC_KEY_PASSWORD for
      # signing and, for notarization, either APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
      # APPLE_TEAM_ID or APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER (an
      # App Store Connect API key) -- confirmed against the pinned package's
      # own source: node_modules/app-builder-lib/out/mac/MacTargetHelper.js
      # (getNotarizeOptions) and out/platformPackager.js (getCscLink /
      # doGetCscPassword). Notarization runs automatically inside
      # electron-builder's package step whenever those env vars resolve --
      # there is no separate workflow step for it. With none of the six
      # secrets below set, this step exports nothing but
      # CSC_IDENTITY_AUTO_DISCOVERY=false so the keychain's own ad-hoc
      # identity (if any) is never picked up and the build stays unsigned.
      - name: Configure Apple signing (opt-in)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CERT_P12" ] || [ -z "$MAC_CERT_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "No Apple signing secrets configured -- building unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false)."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Apple signing secrets present -- importing the certificate into a temporary keychain."
          keychain_path="$RUNNER_TEMP/saturn-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert_path="$RUNNER_TEMP/saturn-mac-cert.p12"
          api_key_path="$RUNNER_TEMP/saturn-asc-api-key.p8"

          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$cert_path"
          printf '%s\n' "$ASC_KEY_P8" > "$api_key_path"
          chmod 600 "$cert_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          existing_keychains="$(security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"$//')"
          security list-keychains -d user -s "$keychain_path" $existing_keychains

          {
            echo "CSC_LINK=$cert_path"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Opt-in Windows code signing. electron-builder falls back to
      # CSC_LINK/CSC_KEY_PASSWORD on Windows the same way it does on macOS
      # (app-builder-lib/out/codeSign/windowsSignToolManager.js's getCscLink
      # call) -- no separate variable names needed. With neither secret set,
      # electron-builder simply skips signing and the .exe ships unsigned.
      - name: Configure Windows signing (opt-in)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$WIN_CERT_PFX" ] || [ -z "$WIN_CERT_PASSWORD" ]; then
            echo "No Windows signing secrets configured -- building unsigned."
            exit 0
          fi
          echo "Windows signing secrets present -- writing the certificate for electron-builder."
          cert_path="$RUNNER_TEMP/saturn-win-cert.pfx"
          printf '%s' "$WIN_CERT_PFX" | base64 --decode > "$cert_path"
          {
            echo "CSC_LINK=$cert_path"
            echo "CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Package
        run: pnpm --filter @dshcode/desktop run ${{ matrix.command }}

      - name: Smoke Windows packaged directory picker
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/smoke-packaged-win32-picker.mjs

      - name: Smoke packaged desktop startup
        run: node apps/desktop/scripts/smoke-packaged-startup.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dshcode-${{ matrix.artifact }}
          path: |
            .artifacts/desktop/release/*.dmg
            .artifacts/desktop/release/*.zip
            .artifacts/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dshcode-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Installable DSHCode desktop preview for macOS and Windows.

            Code signing and notarization are opt-in per repo secret (see apps/desktop/RELEASE.md). If those secrets were not configured for this run, these packages are unsigned: macOS Gatekeeper and Windows SmartScreen may warn before first launch.
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          release_args=()
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSHCode $version" \
            --notes "$RELEASE_NOTES" \
            --verify-tag \
            "${release_args[@]}"
